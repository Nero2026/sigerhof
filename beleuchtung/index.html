<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beleuchtung</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .card { display: flex; flex-direction: column; min-height: 340px; }

    .switchBtn {
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .switchOff { background-color: #444; color: white; }
    .switchOn { background-color: #2ecc71; color: white; }

    .buttonStack {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="card">
      <div class="title">Beleuchtung</div>
      <div class="divider"></div>

      <div class="buttonStack">
        <button id="btnTestShelly" class="switchBtn switchOff" type="button">Test-Shelly</button>
        <button id="btnPlatzlampe" class="switchBtn switchOff" type="button">Platzlampe</button>
        <button id="btnScheuneVorne" class="switchBtn switchOff" type="button">Licht Scheune vorne</button>
      </div>

      <div style="height:14px"></div>
      <a class="menuBtn" href="../index.html">Zurück</a>
    </section>
  </div>

  <script type="module" src="beleuchtung.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beleuchtung Grafik</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/auth.js"></script>
  <style>
    .card {
      display: flex;
      flex-direction: column;
      min-height: 340px;
    }

    .tabBar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tabLink {
      display: block;
      text-align: center;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font-size: 15px;
      font-weight: 900;
      transition: background 0.18s ease, transform 0.08s ease, border-color 0.18s ease;
    }

    .tabLink.active {
      background: linear-gradient(180deg, rgba(76, 131, 255, 0.38), rgba(76, 131, 255, 0.2));
      border-color: rgba(116, 159, 255, 0.7);
    }

    .tabLink:active {
      transform: translateY(1px);
    }

    .planWrap {
      padding: 12px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid var(--line);
    }

    .plan {
      position: relative;
      width: 100%;
      aspect-ratio: 1412 / 739;
      overflow: hidden;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
    }

    .plan img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .regionBtn {
      position: absolute;
      z-index: 2;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(213, 238, 245, 0.78);
      padding: 0;
      margin: 0;
      cursor: pointer;
      transition: background-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .regionBtn:hover:not(:disabled) {
      transform: scale(1.01);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    .regionBtn.active {
      background: rgba(255, 222, 70, 0.8);
    }

    .regionBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .legendItem {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .swatchOff {
      background: rgba(213, 238, 245, 0.78);
    }

    .swatchOn {
      background: rgba(255, 222, 70, 0.8);
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="card">
      <div class="title">Beleuchtung</div>
      <div class="divider"></div>

      <div class="tabBar">
        <a class="tabLink" href="index.html">Liste</a>
        <a class="tabLink active" href="grafik.html">Grafik</a>
      </div>

      <div class="planWrap">
        <div class="plan">
          <img src="grundriss.PNG" alt="Grundriss Sigerhof">

          <button
            id="regionPlatzlampe"
            class="regionBtn"
            data-device-key="platzlampe"
            type="button"
            aria-label="Platzlampe"
            style="left:17.5%; top:2.8%; width:53.3%; height:13.8%;"></button>

          <button
            id="regionScheuneVorne"
            class="regionBtn"
            data-device-key="scheune-vorne"
            type="button"
            aria-label="Scheune vorne"
            style="left:60.7%; top:17.9%; width:9.1%; height:26.9%;"></button>

          <button
            id="regionTestShelly"
            class="regionBtn"
            data-device-key="test-shelly"
            type="button"
            aria-label="Test-Shelly"
            style="left:85.1%; top:52.6%; width:10.8%; height:15.2%;"></button>
        </div>

        <div class="legend">
          <div class="legendItem">
            <span class="swatch swatchOff"></span>
            <span>Aus</span>
          </div>
          <div class="legendItem">
            <span class="swatch swatchOn"></span>
            <span>An</span>
          </div>
        </div>
      </div>

      <div style="height:14px"></div>
      <a class="menuBtn" href="../index.html">Zurück</a>
    </section>
  </div>

  <script type="module" src="graphic.js?v=20260310b"></script>
</body>
</html>

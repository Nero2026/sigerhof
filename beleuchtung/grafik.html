<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beleuchtung Grafik</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/auth.js"></script>
  <style>
    .card {
      display: flex;
      flex-direction: column;
      min-height: 340px;
    }

    .tabBar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tabLink {
      display: block;
      text-align: center;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font-size: 15px;
      font-weight: 900;
      transition: background 0.18s ease, transform 0.08s ease, border-color 0.18s ease;
    }

    .tabLink.active {
      background: linear-gradient(180deg, rgba(76, 131, 255, 0.38), rgba(76, 131, 255, 0.2));
      border-color: rgba(116, 159, 255, 0.7);
    }

    .tabLink:active {
      transform: translateY(1px);
    }

    .planWrap {
      padding: 12px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid var(--line);
    }

    .floorBar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .floorBtn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      transition: background 0.18s ease, transform 0.08s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .floorBtnLabel {
      font-size: 16px;
      letter-spacing: 0.2px;
    }

    .floorBtnSub {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .floorBtn.active {
      background: linear-gradient(180deg, rgba(255, 196, 87, 0.34), rgba(255, 160, 63, 0.18));
      border-color: rgba(255, 197, 94, 0.7);
      box-shadow: 0 0 0 1px rgba(255, 191, 73, 0.18), 0 10px 24px rgba(0,0,0,0.18);
    }

    .floorBtn.active .floorBtnSub {
      color: rgba(255, 244, 214, 0.92);
    }

    .floorBtn:active {
      transform: translateY(1px);
    }

    .floorBadge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .floorBadgeDot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.14);
    }

    .floorBadgeText {
      color: var(--text);
      font-size: 13px;
      letter-spacing: 0.2px;
      text-transform: none;
    }

    .plan {
      position: relative;
      width: 100%;
      aspect-ratio: var(--plan-aspect-ratio, 1103 / 575);
      overflow: hidden;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
    }

    .plan img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .regionBtn {
      position: absolute;
      z-index: 2;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(213, 238, 245, 0.78);
      padding: 0;
      margin: 0;
      cursor: pointer;
      transition: background-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .regionBtn:hover:not(:disabled) {
      transform: scale(1.01);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    .regionBtn.active {
      background: rgba(255, 222, 70, 0.8);
    }

    .regionBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .legendItem {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .swatchOff {
      background: rgba(213, 238, 245, 0.78);
    }

    .swatchOn {
      background: rgba(255, 222, 70, 0.8);
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="card">
      <div class="title">Beleuchtung</div>
      <div class="divider"></div>

      <div class="tabBar">
        <a class="tabLink" href="index.html">Liste</a>
        <a class="tabLink active" href="grafik.html">Grafik</a>
      </div>

      <div class="floorBar" role="tablist" aria-label="Stockwerk wechseln">
        <button id="floorEg" class="floorBtn active" type="button" data-floor="eg">
          <span class="floorBtnLabel">EG</span>
          <span class="floorBtnSub">Erdgeschoss</span>
        </button>
        <button id="floorOg" class="floorBtn" type="button" data-floor="og">
          <span class="floorBtnLabel">OG</span>
          <span class="floorBtnSub">Obergeschoss</span>
        </button>
      </div>

      <div class="planWrap">
        <div class="floorBadge" aria-live="polite">
          <span class="floorBadgeDot"></span>
          <span id="floorBadgeText" class="floorBadgeText">Aktive Ansicht: Erdgeschoss</span>
        </div>
        <div id="planRoot" class="plan">
          <img id="planImage" src="Grundriss_EG.PNG" alt="Grundriss Sigerhof Erdgeschoss">
          <div id="planRegions"></div>
        </div>

        <div class="legend">
          <div class="legendItem">
            <span class="swatch swatchOff"></span>
            <span>Aus</span>
          </div>
          <div class="legendItem">
            <span class="swatch swatchOn"></span>
            <span>An</span>
          </div>
        </div>
      </div>

      <div style="height:14px"></div>
      <a class="menuBtn" href="../index.html">Zurück</a>
    </section>
  </div>

  <script src="app.js?v=20260328e"></script>
</body>
</html>
